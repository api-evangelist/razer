description: 'Razer is a global lifestyle brand for gamers that designs gaming hardware (Blade laptops,
  mice, keyboards, headsets and other peripherals), software (Synapse, Cortex) and services. For developers
  Razer operates the WYVRN immersive gaming platform, exposing the Razer Chroma RGB SDK and REST API for
  controlling 16.8-million-color lighting across devices, the Razer Sensa HD Haptics and THX Spatial Audio
  SDKs, Razer ID for user sign-in, and the Razer Gold / Razer Silver virtual-currency payment and rewards
  APIs for in-app monetization across 34,000+ integrated games and apps.'
